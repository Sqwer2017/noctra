<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>noctra</title>
    <!--
      Google Identity Services: нужен для One Tap и входа по idToken.
      async defer — скрипт не блокирует отрисовку. Если загрузка не удалась,
      кнопка входа автоматически уходит на OAuth-редирект (см. src/services/auth.ts).
    -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!--
      Предварительное соединение с YouTube.

      Скрипт IFrame API подключается по требованию — когда пользователь
      впервые включает YouTube-трек (см. src/components/player/YouTubeBridge.ts).
      Здесь только прогреваем соединение, чтобы плеер поднялся быстрее:
      сам скрипт не грузится, пока он не нужен, и не тормозит загрузку.
    -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
