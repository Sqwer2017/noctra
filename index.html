<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>noctra</title>
    <!--
      Google Identity Services: нужен для One Tap и входа по idToken.
      async defer — скрипт не блокирует отрисовку. Если загрузка не удалась,
      кнопка входа автоматически уходит на OAuth-редирект (см. src/services/auth.ts).
    -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
